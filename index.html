<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:14px 16px 100px}
.hd{display:flex;align-items:center;gap:12px;padding:6px 0 14px}

h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}

.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.set{flex:1;min-width:64px;height:40px;border-radius:12px;border:1px solid #334155;background:var(--line);color:var(--mut);font:inherit;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;gap:4px}
.set.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc)}
.kg{flex:0 0 100%;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#cbd5e1;background:rgba(30,41,59,.8);border:1px solid #334155;border-radius:12px;padding:6px 12px}
.kg input{width:64px;margin-left:auto;padding:6px;border-radius:8px;border:1px solid #334155;background:var(--bg);color:var(--sky);font:inherit;font-size:14px;font-weight:700;text-align:center}
.tipbox{display:flex;gap:8px;margin-top:12px;padding:10px;background:rgba(2,6,23,.6);border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--mut);line-height:1.5}
.tipbox svg{flex:none;color:#fbbf24;margin-top:1px}.tipbox b{color:#cbd5e1}
.tip{color:var(--mut);font-size:13px;line-height:1.5}
.demo{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;padding:10px;border-radius:12px;border:1px solid #334155;background:var(--line);color:var(--sky);font-size:13px;font-weight:600;text-decoration:none}
.ghost{border:1px solid #334155;background:var(--line);color:#cbd5e1;padding:10px 14px;border-radius:12px;font:inherit;font-size:13px;font-weight:600}
.big{width:100%;border:0;background:#16a34a;color:#fff;padding:13px;border-radius:12px;font:inherit;font-weight:700;font-size:15px;margin-top:10px;box-shadow:0 6px 18px rgba(22,163,74,.3)}
.two{display:flex;gap:8px;margin:0 0 14px}.two .ghost{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;font-weight:600;color:var(--mut);display:block}
label input{width:100%;margin-top:4px;padding:11px;border-radius:12px;border:1px solid #334155;background:var(--line);color:var(--ink);font:inherit;font-size:16px}
.log{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.dn{color:var(--acc)}.up{color:var(--warn)}
.mv{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600}.mv img{width:48px;height:48px;border-radius:50%;flex:none}.mv small{display:block;color:var(--mut);font-weight:500;font-size:12px}.rg{width:184px;height:184px;border-radius:50%;padding:7px;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:6px 0}.pi{width:170px;height:170px;border-radius:50%;display:block}

.th{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none}.th svg,.fg svg{display:block;width:100%;height:100%}.fg{overflow:hidden;animation:none!important}

.sts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}.sts div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}.sts b{display:block;font-size:20px;color:var(--acc)}.sts span{font-size:10px;color:var(--mut);font-weight:600}.lt{color:var(--mut);font-size:12px;margin:-6px 0 10px}
details.ex{margin-top:0}details.ex>summary{list-style:none;cursor:pointer;color:var(--ink);font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}details.ex>summary::-webkit-details-marker{display:none}details.ex>summary::after{content:"›";font-size:26px;color:var(--mut);transition:transform .2s}details.ex[open]>summary::after{transform:rotate(90deg)}details.ex>summary small{display:block;color:var(--mut);font-size:12px;font-weight:500;margin-top:2px}details.ex[open]>summary{margin-bottom:6px}
.pg{font-size:13px;font-weight:700;color:var(--mut);margin-left:auto;padding-right:10px}.pg.ok{color:var(--acc)}details.ex[open]>summary{margin-bottom:10px}
.sr{flex:0 0 100%;display:flex;align-items:flex-end;gap:8px}.sr .set{flex:0 0 78px;height:44px}.sr label{flex:1;font-size:11px;font-weight:600;color:var(--mut)}.sr label input{margin-top:2px;padding:9px 6px;font-size:16px;text-align:center}
textarea{width:100%;border-radius:12px;border:1px solid #334155;background:var(--line);color:var(--ink);font:inherit;font-size:13px;padding:10px}
#rb{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(15,23,42,.96);border:1px solid #334155;color:var(--ink);border-radius:16px;padding:12px 16px;display:none;align-items:center;gap:10px;font-weight:600;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#rb b{font-size:22px;margin-right:auto;color:var(--sky);font-variant-numeric:tabular-nums}
#rb button{border:1px solid #334155;background:var(--line);color:#cbd5e1;border-radius:10px;padding:8px 12px;font:inherit;font-weight:600}
#pl{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:10}
#pl h2{font-size:32px;margin:8px 0;font-weight:800}
#pl .t{font-size:84px;font-weight:800;color:var(--sky);line-height:1;font-variant-numeric:tabular-nums}
#pl p{color:var(--mut);margin:6px 0}
#pl .bar{width:100%;max-width:360px;margin:18px 0}
#pl .row{justify-content:center;gap:10px;margin-top:10px}

.sug{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.35)}
.sgt{flex:1 1 150px}.sgt b{display:block;color:var(--sky);font-size:16px}.sgt small{display:block;color:#cbd5e1;font-size:12px;font-weight:500;margin-top:2px}
.sug .ghost{min-height:44px;padding:10px 18px;color:var(--sky);font-weight:700}
.stp{display:flex;align-items:center;gap:6px;flex:0 0 100%;font-size:12px}.stp input{width:64px;padding:6px;margin:0;text-align:center;font-size:14px}
.set{position:relative}.prb{position:absolute;top:-7px;right:-6px;margin:0!important}.prb,.prt{background:#facc15;color:#1c1917;border-radius:999px;padding:1px 6px;font-size:10px;font-weight:800;margin-left:4px;vertical-align:middle}
.cambtn{width:100%;margin-top:12px;min-height:48px;color:var(--sky);font-weight:700}
#cam{position:fixed;inset:0;z-index:10;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#cam video,#cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#cam .cbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%}
#cam .cbox h2{margin:0 0 8px;font-size:24px}#cam .cbox p{color:#cbd5e1;font-size:14px;line-height:1.5}
.cnote{background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.4);border-radius:12px;padding:10px}.cpriv{color:var(--mut)!important;font-size:12px!important}
.cerr{color:var(--warn)!important;font-weight:600}.cload{color:var(--sky)!important;font-weight:600}
#cam .ctop{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;text-align:center;text-shadow:0 2px 10px #000}
#cam .ctop span{font-weight:700;font-size:15px;background:rgba(2,6,23,.6);padding:4px 12px;border-radius:999px}
#cam .ctop b{display:block;font-size:120px;line-height:1.05;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
#ch{min-height:28px;margin:0 auto;font-size:18px;font-weight:700;display:inline-block;padding:4px 12px;border-radius:12px;background:rgba(2,6,23,.6)}#ch:empty{background:none}#ch.warn{color:#fde047}
#cg{font-size:30px;font-weight:700;color:#cbd5e1;text-shadow:0 2px 10px #000}#cam .ctop b{display:inline}
.cframe{position:absolute;inset:0;border:8px solid transparent;pointer-events:none;transition:border-color .2s}.cframe.ok{border-color:rgba(34,197,94,.85)}.cframe.bad{border-color:rgba(251,113,133,.9)}
.cbar{position:absolute;right:16px;top:32%;height:38%;width:26px;border-radius:14px;background:rgba(2,6,23,.6);border:2px solid rgba(255,255,255,.5);overflow:hidden}
.cbar i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--sky);transition:height .08s}.cbar i.ok{background:var(--acc)}
.cbar em{position:absolute;right:30px;top:-2px;white-space:nowrap;font-style:normal;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 6px #000}.cbar{overflow:visible}.cbar i{border-radius:12px}
.cmid{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;pointer-events:none;text-shadow:0 2px 14px #000}
.cmid .cbig{font-size:110px;font-weight:800;line-height:1;color:#fff;font-variant-numeric:tabular-nums}.cmid .cmsg{font-size:24px;font-weight:800;color:#fff;background:rgba(2,6,23,.55);padding:4px 14px;border-radius:12px}
.cset{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}.cset label{font-size:12px}.cset input,.cset select{width:100%;margin-top:4px;padding:10px 6px;border-radius:12px;border:1px solid #334155;background:var(--line);color:var(--ink);font:inherit;font-size:16px;text-align:center}
.cvo{display:flex!important;align-items:center;gap:10px;font-size:14px!important;color:var(--ink)!important;margin:10px 0}.cvo input{width:22px;height:22px;accent-color:#16a34a}
.cgrp{margin:18px 4px 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.csum{margin:8px 0;padding-left:20px;color:#cbd5e1;font-size:16px;line-height:1.7}

</style>

fld("pw","Weight (kg)")+fld("pwa","Waist (cm)")+fld("pa","Upper arm (cm)")+fld("pt","Thigh (cm)")+'</div><button class="big" onclick="add()">Save entry</button>'+ch("w","Weight (kg)")+ch("wa","Waist (cm)")+'<div style="margin-top:18px">';
if(!S.log.length)h+='<p class="tip">No entries yet. Save your starting measurements today.</p>';
S.log.slice().reverse().forEach(function(l){var dif=function(a,b){if(!a||!b||l===f)return"";var d=(a-b).toFixed(1);return' <span class="'+(d<=0?'dn':'up')+'">('+(d>0?'+':'')+d+')</span>'};
h+='<div class="log"><b>'+l.d+'</b><span>'+(l.w||"–")+' kg'+dif(l.w,f.w)+' · waist '+(l.wa||"–")+dif(l.wa,f.wa)+' · arm '+(l.a||"–")+dif(l.a,f.a)+' · thigh '+(l.t||"–")+dif(l.t,f.t)+'</span></div>'});
v.innerHTML=h+'</div>'}
function fld(id,l){return'<label>'+l+'<input id="'+id+'" type="number" inputmode="decimal"></label>'}
function add(){var g=function(i){return parseFloat(document.getElementById(i).value)||null},o={d:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short"}),w:g("pw"),wa:g("pwa"),a:g("pa"),t:g("pt")};
if(!o.w&&!o.wa&&!o.a&&!o.t)return;S.log.push(o);save();render()}
load();render();
</script>
